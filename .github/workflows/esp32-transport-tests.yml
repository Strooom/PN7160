name: ESP32 transport tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transport-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test ESP32 transport and legacy API with sanitizers
        run: python3 test/esp32/run.py
